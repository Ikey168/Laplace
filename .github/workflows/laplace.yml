name: Laplace

# Builds the bootable kernel, runs the host-side unit tests of the time-travel
# and persistence modules, runs the headless demos, and then boots the kernel in
# QEMU: a heisenbug is recorded and debugged backward over MCP and stock gdb,
# every retained epoch is re-executed and checked byte-exact, and the machine
# survives power cuts on its IDE disk.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm musl-tools
          gcc --version | head -1
          nasm -v

      - name: Build the kernel (freestanding, -Werror)
        run: make kernel

      - name: Checkpoint / store / restore unit tests
        run: |
          set -e
          cd tests
          K="../kernel/checkpoint.c ../kernel/snapshot_store.c ../kernel/checkpoint_extstate.c ../kernel/checkpoint_barrier.c"
          KR="$K ../kernel/ramdisk.c"
          gcc -I../include -Wall -o /tmp/t_store  test_snapshot_store.c            && /tmp/t_store
          gcc -I../include -Wall -o /tmp/t_bar    test_checkpoint_barrier.c   ../kernel/checkpoint_barrier.c && /tmp/t_bar
          gcc -I../include -Wall -o /tmp/t_kern   test_checkpoint_kernel.c    $K && /tmp/t_kern
          gcc -I../include -Wall -o /tmp/t_proc   test_checkpoint_proctable.c ../kernel/checkpoint_proctable.c && /tmp/t_proc
          gcc -I../include -Wall -o /tmp/t_file   test_checkpoint_filetable.c ../kernel/checkpoint_filetable.c ../kernel/checkpoint_extstate.c && /tmp/t_file
          gcc -I../include -Wall -o /tmp/t_ipc    test_checkpoint_ipc.c       ../kernel/checkpoint_ipc.c && /tmp/t_ipc
          gcc -I../include -Wall -o /tmp/t_drv    test_checkpoint_driver.c    ../kernel/checkpoint_driver.c && /tmp/t_drv
          gcc -I../include -Wall -o /tmp/t_disk   test_checkpoint_disk.c      ../kernel/checkpoint_disk.c && /tmp/t_disk
          gcc -I../include -Wall -o /tmp/t_fb     test_checkpoint_fb.c        ../kernel/checkpoint_fb.c && /tmp/t_fb
          gcc -I../include -Wall -o /tmp/t_seq    test_checkpoint_restore_seq.c ../kernel/checkpoint_restore_seq.c && /tmp/t_seq
          gcc -I../include -Wall -o /tmp/t_ckpt   test_checkpoint.c            $K && /tmp/t_ckpt
          gcc -I../include -Wall -o /tmp/t_wb     test_checkpoint_writeback.c  $K && /tmp/t_wb
          gcc -I../include -Wall -o /tmp/t_rs     test_checkpoint_restore.c    $K && /tmp/t_rs
          gcc -I../include -Wall -o /tmp/t_ctx    test_checkpoint_context.c    $K && /tmp/t_ctx
          gcc -I../include -Wall -o /tmp/t_rc     test_checkpoint_reconstruct.c $K && /tmp/t_rc
          gcc -I../include -Wall -o /tmp/t_ro     test_checkpoint_readonly.c   $K && /tmp/t_ro
          gcc -I../include -Wall -o /tmp/t_tm     test_checkpoint_timer.c      $K && /tmp/t_tm
          gcc -I../include -Wall -o /tmp/t_ext    test_checkpoint_extstate.c   ../kernel/checkpoint_extstate.c && /tmp/t_ext
          gcc -I../include -Wall -o /tmp/t_init   test_persistence_init.c     $KR && /tmp/t_init
          gcc -I../include -Wall -o /tmp/t_ide    test_checkpoint_ide.c       ../kernel/checkpoint_ide.c ../kernel/snapshot_store.c && /tmp/t_ide
          gcc -I../include -Wall -o /tmp/t_idb    test_ide_durable_boot.c     ../kernel/checkpoint_ide.c ../kernel/snapshot_store.c ../kernel/checkpoint_journal.c ../kernel/keyframe_store.c ../kernel/keyframe_ring.c && /tmp/t_idb
          gcc -I../include -Wall -o /tmp/t_jrnl   test_checkpoint_journal.c   ../kernel/checkpoint_journal.c && /tmp/t_jrnl
          gcc -I../include -Wall -o /tmp/t_sr     test_sched_record.c         ../kernel/sched_record.c && /tmp/t_sr
          gcc -I../include -Wall -o /tmp/t_time   test_time_record.c          ../kernel/time_record.c && /tmp/t_time
          gcc -I../include -Wall -o /tmp/t_ent    test_entropy_record.c       ../kernel/entropy_record.c && /tmp/t_ent
          gcc -I../include -Wall -o /tmp/t_replay test_replay_engine.c        ../kernel/replay_engine.c && /tmp/t_replay
          gcc -I../include -Wall -o /tmp/t_div    test_divergence.c           ../kernel/divergence.c && /tmp/t_div
          gcc -I../include -Wall -o /tmp/t_kfr    test_keyframe_ring.c        ../kernel/keyframe_ring.c && /tmp/t_kfr
          gcc -I../include -Wall -o /tmp/t_rw     test_rewind.c               ../kernel/rewind.c ../kernel/keyframe_ring.c ../kernel/replay_engine.c && /tmp/t_rw
          gcc -I../include -Wall -o /tmp/t_rev    test_reverse.c              ../kernel/reverse.c ../kernel/rewind.c ../kernel/keyframe_ring.c ../kernel/replay_engine.c && /tmp/t_rev
          gcc -I../include -Wall -o /tmp/t_rb     test_revbreak.c             ../kernel/revbreak.c ../kernel/reverse.c ../kernel/rewind.c ../kernel/keyframe_ring.c ../kernel/replay_engine.c && /tmp/t_rb
          gcc -I../include -Wall -o /tmp/t_gdb    test_gdbstub.c              ../kernel/gdbstub.c && /tmp/t_gdb
          gcc -I../include -Wall -o /tmp/t_mcp    test_mcp.c                  ../kernel/mcp.c && /tmp/t_mcp
          gcc -I../include -Wall -o /tmp/t_jc     test_journal_capture.c      ../kernel/journal_capture.c ../kernel/checkpoint_journal.c && /tmp/t_jc
          gcc -I../include -Wall -o /tmp/t_ks     test_keyframe_store.c       ../kernel/keyframe_store.c ../kernel/snapshot_store.c ../kernel/keyframe_ring.c && /tmp/t_ks
          gcc -I../include -Wall -o /tmp/t_ksf    test_kstate_format.c        ../kernel/kstate_format.c ../kernel/snapshot_store.c && /tmp/t_ksf
          gcc -I../include -Wall -o /tmp/t_ps     test_page_store.c           ../kernel/page_store.c ../kernel/snapshot_store.c && /tmp/t_ps
          gcc -I../include -Wall -o /tmp/t_memfs  test_memfs.c                ../kernel/memfs.c ../kernel/kstate_format.c ../kernel/snapshot_store.c && /tmp/t_memfs
          gcc -I../include -Wall -o /tmp/t_iorec  test_iorec.c                ../kernel/iorec.c && /tmp/t_iorec
          gcc -I../include -Wall -o /tmp/t_pm     test_pmatch.c               ../kernel/pmatch.c && /tmp/t_pm
          gcc -I../include -Wall -o /tmp/t_rd     test_replay_driver.c        ../kernel/replay_driver.c ../kernel/replay_engine.c && /tmp/t_rd
          gcc -I../include -Wall -o /tmp/t_ds     test_divergence_scan.c      ../kernel/divergence_scan.c ../kernel/divergence.c && /tmp/t_ds
          gcc -I../include -Wall -o /tmp/t_gsl    test_gdb_serial.c           ../kernel/gdb_serial.c ../kernel/gdbstub.c ../kernel/gdbstub_sync.c && /tmp/t_gsl
          gcc -I../include -Wall -o /tmp/t_msl    test_mcp_server.c           ../kernel/mcp_server.c ../kernel/mcp.c && /tmp/t_msl
          gcc -I../include -Wall -o /tmp/t_jr     test_journal_ring.c         ../kernel/journal_ring.c ../kernel/checkpoint_journal.c ../kernel/journal_capture.c ../kernel/keyframe_ring.c && /tmp/t_jr

  headless-demos:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4
      - name: Persistence demo (host harness)
        run: bash scripts/test/persistence_demo.sh
      - name: Record and replay byte-identically (host harness)
        run: bash scripts/test/timetravel_demo.sh
      - name: Scrub backwards (host harness)
        run: bash scripts/test/scrub_demo.sh
      - name: MCP heisenbug (host harness)
        run: bash scripts/test/mcp_heisenbug_demo.sh
      - name: Keyframe store + journal + MCP loop (host harness)
        run: bash scripts/test/timetravel_live_demo.sh

  qemu:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm musl-tools qemu-system-x86 gdb grub-pc-bin xorriso mtools
      - name: Build
        run: make
      - name: Boot, record, verify every epoch byte-exact (in-kernel self-test)
        run: make selftest
      - name: Raw RDTSC/CPUID replay exactly; an RDRAND leak is located (in QEMU)
        run: bash tests/qemu/determinism_gate.sh
      - name: x87/SSE/AVX state survives preemption and is verified (in QEMU)
        run: bash tests/qemu/fpu_gate.sh
      - name: Unmodified static Linux programs run and replay (in QEMU)
        run: bash tests/qemu/linux_gate.sh
      - name: Programs load from outside the kernel with argv/envp (in QEMU)
        run: bash tests/qemu/loader_gate.sh
      - name: brk, mmap, mprotect, and demand paging replay exactly (in QEMU)
        run: bash tests/qemu/vm_gate.sh
      - name: Incremental keyframes at 256 MiB resident (in QEMU)
        run: bash tests/qemu/scale_gate.sh
      - name: Files from a seed image; Lua writes and reads a file (in QEMU)
        run: bash tests/qemu/files_gate.sh
      - name: 10 MiB of journaled input in one epoch; a stray input call is caught (in QEMU)
        run: bash tests/qemu/input_gate.sh
      - name: Sleep, idle, and wake at journaled steps (in QEMU)
        run: bash tests/qemu/sleep_gate.sh
      - name: fork, execve, wait, kill; rewind between fork and exec (in QEMU)
        run: bash tests/qemu/proc_gate.sh
      - name: Signals, handlers, timers; a fault stops for gdb (in QEMU)
        run: bash tests/qemu/signal_gate.sh
      - name: Preemption at any instruction, found again by state (in QEMU, TCG, no PMU)
        run: bash tests/qemu/preempt_gate.sh
      - name: A Lua session typed on the console and a pipeline replay byte-exact (in QEMU)
        run: python3 tests/qemu/console_gate.py
      - name: An HTTP server answers the host while recording; it and a loopback pair replay byte-exact (in QEMU)
        run: python3 tests/qemu/net_gate.py
      - name: "Target: a pthreads lost-update race, traced to the other thread's store (MCP + gdb)"
        run: bash tests/qemu/threads_gate.sh
      - name: "Target: hello world (record, verify, sabotage caught, MCP + gdb backward)"
        run: python3 tests/qemu/targets_gate.py hello
      - name: "Target: Lua 5.4 running a script from the seed image"
        run: python3 tests/qemu/targets_gate.py lua
      - name: "Target: the SQLite shell creating, filling, and querying a database file"
        run: python3 tests/qemu/targets_gate.py sqlite
      - name: "Dynamically linked: a musl PIE and the distribution's lua5.4 with glibc (record, replay, gdb)"
        run: |
          sudo apt-get install -y lua5.4
          python3 tests/qemu/dynamic_gate.py
      - name: The same under KVM (the runner's CPU exposes no PMU)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo chmod 666 /dev/kvm
          QEMU_ACCEL=kvm bash tests/qemu/preempt_gate.sh
          make selftest QEMU_FLAGS="-m 256M -display none -no-reboot -enable-kvm -cpu host"
          QEMU_ACCEL=kvm python3 tests/qemu/timetravel_e2e.py
      - name: Heisenbug debugged backward over MCP and gdb (in QEMU)
        run: python3 tests/qemu/timetravel_e2e.py
      - name: Power cut and resume on the IDE disk (in QEMU)
        run: bash scripts/test/qemu_persistence_demo.sh
      - name: Power cut and resume on an AHCI (SATA) disk (in QEMU)
        run: LAPLACE_DISK=ahci bash scripts/test/qemu_persistence_demo.sh
      - name: Bootable ISO (GRUB, BIOS)
        run: make iso
      - name: The release tarball works on its own (make dist-test)
        run: make dist-test

  # Recording overhead (#255): not a gate. Every push to main measures the
  # table under TCG and KVM and keeps it as an artifact.
  bench:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm musl-tools qemu-system-x86
      - name: Build
        run: make
      - name: Overhead under TCG
        run: python3 scripts/bench/overhead.py --out bench-tcg.md
      - name: Overhead under KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo chmod 666 /dev/kvm
          QEMU_ACCEL=kvm python3 scripts/bench/overhead.py --out bench-kvm.md
      - name: Table
        if: always()
        run: cat bench-tcg.md bench-kvm.md >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: overhead
          path: bench-*.md
