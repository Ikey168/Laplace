name: TCG probe (throwaway)

# One-off: where the in-kernel self-test spends its time under the runners'
# QEMU TCG when it does not finish. Removed once the qemu job passes.

on:
  push:
    branches: [claude/festive-keller-m5xkmf]

permissions:
  contents: read

jobs:
  tcg:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        n: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm musl-tools qemu-system-x86 binutils
          qemu-system-x86_64 --version | head -1; gcc --version | head -1; grep -m1 'model name' /proc/cpuinfo
      - name: Build
        run: make
      - name: Self-test boots, sampled when one hangs
        run: |
          cat > /tmp/sample.py <<'PY'
          import os, re, socket, subprocess, sys, tempfile, time
          def boot(i):
              work = tempfile.mkdtemp()
              con = os.path.join(work, "c.log")
              mon = 46000 + i
              q = subprocess.Popen(["qemu-system-x86_64", "-m", "256M", "-display", "none", "-no-reboot",
                                    "-kernel", "build/laplace.elf", "-append", "selftest exit",
                                    "-device", "isa-debug-exit,iobase=0xf4,iosize=0x04",
                                    "-monitor", f"tcp:127.0.0.1:{mon},server=on,wait=off",
                                    "-serial", f"file:{con}", "-serial", "null", "-serial", "null"],
                                   stdin=subprocess.DEVNULL, stdout=subprocess.DEVNULL, stderr=subprocess.STDOUT)
              t0 = time.monotonic()
              while q.poll() is None and time.monotonic() - t0 < 240:
                  time.sleep(0.5)
              text = open(con, errors="replace").read().replace("\r", "")
              if q.poll() is not None:
                  print(f"=== boot {i}: exit {q.returncode} after {time.monotonic() - t0:.0f} s; "
                        + ("PASSED" if "selftest: PASSED" in text else "no PASSED"))
                  if "selftest: PASSED" not in text:
                      print(text[-3000:])
                  return
              print(f"=== boot {i}: still running after 240 s")
              rips = []
              m = socket.create_connection(("127.0.0.1", mon), timeout=10)
              m.settimeout(2)
              for _ in range(16):
                  m.sendall(b"info registers\n")
                  time.sleep(0.4)
                  buf = b""
                  try:
                      while b"EFER" not in buf:
                          d = m.recv(65536)
                          if not d: break
                          buf += d
                  except socket.timeout:
                      pass
                  r = re.findall(rb"RIP=([0-9a-f]{16})", buf)
                  if r: rips.append(r[-1].decode())
                  time.sleep(0.6)
              for r in rips:
                  out = subprocess.run(["addr2line", "-f", "-i", "-e", "build/laplace.elf", "0x" + r],
                                       capture_output=True, text=True).stdout.split()
                  print("  ", r, " ".join(out))
              print(text[-4000:])
              q.kill()
          for i in range(6):
              boot(i)
          PY
          python3 /tmp/sample.py
