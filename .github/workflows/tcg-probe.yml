name: TCG probe (throwaway)

# One-off: the runner's compiler emitted BMI2 (shlx) into the kernel, which
# QEMU's default CPU (qemu64) rejects. Does the toolchain default to
# x86-64-v3, and are the distribution's libraries (musl's libc.a, glibc,
# lua5.4) built for it too? Removed once the qemu job passes.

on:
  push:
    branches: [claude/festive-keller-m5xkmf]

permissions:
  contents: read

jobs:
  isa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm musl-tools qemu-system-x86 binutils lua5.4
      - name: The ISA things are built for
        run: |
          set +e
          dpkg --print-architecture
          grep -rhs -i 'variant\|amd64v3\|Architecture-Variant' /etc/apt/ /etc/dpkg/ | head -5
          gcc --version | head -1
          gcc -Q --help=target 2>/dev/null | grep -E '^\s+-march=|^\s+-mtune='
          echo 'int f(unsigned a, unsigned b){return a<<b;}' > /tmp/t.c
          gcc -O2 -c /tmp/t.c -o /tmp/t.o && objdump -d /tmp/t.o | grep -E 'shl'
          ls /usr/lib/gcc/x86_64-linux-gnu/*/ 2>/dev/null | head -3
          cat /usr/lib/gcc/x86_64-linux-gnu/*/specs 2>/dev/null | head -3
          gcc -dumpspecs | grep -n -i 'march' | head -5
          env | grep -i -E 'CFLAGS|march' | head
          v3() {  # count BMI2/AVX2/FMA/MOVBE instructions in a binary
            objdump -d "$1" 2>/dev/null | grep -c -E '\s(shlx|shrx|sarx|rorx|pdep|pext|mulx|andn|vpbroadcast|vfmadd|movbe|lzcnt|tzcnt)\s'
          }
          for f in /usr/lib/musl/lib/libc.a /usr/lib/x86_64-linux-musl/libc.so /lib/x86_64-linux-gnu/libc.so.6 \
                   /lib/x86_64-linux-gnu/libm.so.6 /usr/bin/lua5.4 /usr/bin/qemu-system-x86_64; do
            [ -e "$f" ] && echo "$f: $(v3 "$f") v3-only instructions"
          done
      - name: Build (baseline ISA) and boot under qemu64
        run: |
          make
          echo "kernel: $(objdump -d build/laplace.elf | grep -c -E '\s(shlx|shrx|sarx|rorx|andn|lzcnt|tzcnt)\s') v3-only instructions"
          for e in build/user/musl_hello.elf build/user/musl_threads.elf; do
            echo "$e: $(objdump -d $e | grep -c -E '\s(shlx|shrx|sarx|rorx|andn|lzcnt|tzcnt|vpbroadcast|vfmadd|movbe)\s') v3-only instructions"
          done
          make selftest
          bash tests/qemu/linux_gate.sh
