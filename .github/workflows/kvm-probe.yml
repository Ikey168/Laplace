name: KVM probe (throwaway)

# One-off runs on the development branch for #236 and #255: the KVM gates,
# the overhead table under KVM, and why TCG boots hang on the runners' QEMU.
# Removed once the results are in.

on:
  push:
    branches: [claude/festive-keller-m5xkmf]

jobs:
  kvm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm musl-tools qemu-system-x86 gdb
          qemu-system-x86_64 --version
          sudo chmod 666 /dev/kvm
      - name: Build
        run: make
      - name: TCG boots, time-limited, console shown
        if: always()
        run: |
          for cpu in qemu64 max Skylake-Client; do
            for extra in "" "norecord bench=run"; do
              echo "=== -cpu $cpu, $extra"
              timeout 90 qemu-system-x86_64 -cpu $cpu -m 256M -display none -no-reboot \
                -device isa-debug-exit,iobase=0xf4,iosize=0x04 -kernel build/laplace.elf \
                -append "run=musl_hello selftest exit $extra" \
                -serial stdio -serial null -serial null < /dev/null 2>&1 | tr -d '\r' | head -60 || true
            done
          done
      - name: KVM boot log
        if: always()
        run: |
          timeout 120 qemu-system-x86_64 -enable-kvm -cpu host -m 256M -display none -no-reboot \
            -device isa-debug-exit,iobase=0xf4,iosize=0x04 -kernel build/laplace.elf \
            -append "run=musl_hello selftest exit" -serial stdio -serial null -serial null < /dev/null 2>&1 \
            | tr -d '\r' | head -40 || true
      - name: Self-test under KVM
        if: always()
        run: timeout 600 make selftest QEMU_FLAGS="-m 256M -display none -no-reboot -enable-kvm -cpu host"
      - name: Preemption gate under KVM
        if: always()
        run: QEMU_ACCEL=kvm timeout 1200 bash tests/qemu/preempt_gate.sh
      - name: e2e under KVM
        if: always()
        run: QEMU_ACCEL=kvm timeout 1200 python3 tests/qemu/timetravel_e2e.py
