name: KVM probe (throwaway)

# One-off run on the development branch for #236 and #255: the KVM gates and
# the overhead table under KVM. Removed once the results are in.

on:
  push:
    branches: [claude/festive-keller-m5xkmf]

jobs:
  kvm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm musl-tools qemu-system-x86 gdb
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -w /dev/kvm
      - name: Build
        run: make
      - name: Self-test under KVM
        run: make selftest QEMU_FLAGS="-m 256M -display none -no-reboot -enable-kvm -cpu host"
      - name: Preemption gate under KVM
        run: QEMU_ACCEL=kvm bash tests/qemu/preempt_gate.sh
      - name: e2e under KVM
        run: QEMU_ACCEL=kvm python3 tests/qemu/timetravel_e2e.py
      - name: Overhead under KVM
        if: always()
        run: QEMU_ACCEL=kvm python3 scripts/bench/overhead.py --out bench-kvm.md && cat bench-kvm.md
      - name: Overhead under TCG
        if: always()
        run: python3 scripts/bench/overhead.py --out bench-tcg.md && cat bench-tcg.md
